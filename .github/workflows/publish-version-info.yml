name: Publish NPM Version Info

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        if: env.PAT != ''
        uses: peter-evans/repository-dispatch@v2
        env:
          PAT: ${{ secrets.PAT }}
        with:
          token: ${{ env.PAT }}
          repository: lyswhut/lx-music-mobile-version-info
          event-type: npm-release
